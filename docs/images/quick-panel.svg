    <path d="M0 449h575" stroke="#33445d"/>
    <g transform="translate(30 470)" font-family="Segoe UI, sans-serif">
      <circle cx="14" cy="14" r="14" fill="#22324a"/>
      <path d="M14 7v14M7 14h14" stroke="#aabbd0" stroke-width="2" stroke-linecap="round"/>
      <text x="42" y="20" fill="#aebdd0" font-size="13">Configurações do Windows</text>
