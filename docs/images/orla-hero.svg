<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">Orla em dois monitores</title>
  <desc id="desc">Ilustração da topbar e do dock do Orla funcionando de forma consistente em dois monitores.</desc>
  <defs>
    <linearGradient id="page" x1="80" y1="30" x2="1360" y2="690" gradientUnits="userSpaceOnUse">
      <stop stop-color="#151923"/>
      <stop offset="1" stop-color="#08090D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1110 210) rotate(135) scale(520 400)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A84FF" stop-opacity=".3"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="240" y1="160" x2="1120" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#202938"/>
      <stop offset=".55" stop-color="#111722"/>
      <stop offset="1" stop-color="#182032"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1">
      <stop stop-color="#5AC8FA"/>
      <stop offset="1" stop-color="#0A84FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>
  <rect width="1440" height="720" rx="28" fill="url(#page)"/>
  <rect width="1440" height="720" rx="28" fill="url(#glow)"/>

  <g font-family="Segoe UI, Inter, sans-serif">
    <text x="86" y="86" fill="#F5F7FA" font-size="42" font-weight="650">Uma interface. Todas as telas.</text>
    <text x="88" y="124" fill="#A7AFBE" font-size="19">Topbar reservada, dock inteligente e foco imediato — em um único processo.</text>
  </g>

