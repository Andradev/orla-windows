        <path d="m24 22 13 12-13 12V18l13 12-13 12" fill="none" stroke="#cbd8e8" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="62" y="36" fill="#f2f6fc" font-size="15" font-weight="650">Bluetooth</text>
