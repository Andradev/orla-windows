        <path d="M37 20a18 18 0 1 0 10 31 17 17 0 0 1-10-31Z" fill="#79bdff"/>
        <text x="62" y="36" fill="#f2f7ff" font-size="15" font-weight="650">Luz noturna</text>
        <text x="62" y="58" fill="#bddcff" font-size="12">Ligada</text>
      </g>

