        <path d="M25 17c4 3 4 8 0 11m5-17c8 7 8 17 0 24" fill="none" stroke="#dbe7f6" stroke-width="2.2" stroke-linecap="round"/>
        <rect x="56" y="18" width="459" height="6" rx="3" fill="#344359"/>
        <rect x="56" y="18" width="304" height="6" rx="3" fill="#54aaff"/>
        <circle cx="360" cy="21" r="9" fill="#eef7ff" stroke="#54aaff" stroke-width="3"/>
