<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Painel de controles rápidos do Orla</title>
  <desc id="desc">Ilustração genérica do painel com Wi-Fi, Bluetooth, economia de energia, luz noturna, brilho e volume.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#101d32"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fc3ff"/>
      <stop offset="1" stop-color="#3d7cff"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000814" flood-opacity=".48"/>
    </filter>
  </defs>

  <rect width="1200" height="620" rx="32" fill="url(#background)"/>
  <circle cx="1035" cy="64" r="210" fill="#287dff" opacity=".08"/>
  <circle cx="84" cy="570" r="190" fill="#43c5ff" opacity=".06"/>

  <g transform="translate(72 78)">
