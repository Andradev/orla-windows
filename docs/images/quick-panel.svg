    <text x="0" y="91" fill="#f4f8ff" font-family="Segoe UI, sans-serif" font-size="36" font-weight="650">Controles rápidos</text>
    <text x="0" y="124" fill="#9fb0c8" font-family="Segoe UI, sans-serif" font-size="17">Informação útil, ações nativas e resposta imediata.</text>

    <g font-family="Segoe UI, sans-serif" font-size="15">
      <g transform="translate(0 184)">
        <circle cx="10" cy="10" r="10" fill="#3e9bff" opacity=".2"/>
        <path d="M6 10.5 9 13l5-6" fill="none" stroke="#65b8ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="32" y="15" fill="#dce8f7">APIs do próprio Windows</text>
      </g>
      <g transform="translate(0 229)">
        <circle cx="10" cy="10" r="10" fill="#3e9bff" opacity=".2"/>
        <path d="M6 10.5 9 13l5-6" fill="none" stroke="#65b8ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="32" y="15" fill="#dce8f7">Painel leve e transitório</text>
      </g>
      <g transform="translate(0 274)">
        <circle cx="10" cy="10" r="10" fill="#3e9bff" opacity=".2"/>
        <path d="M6 10.5 9 13l5-6" fill="none" stroke="#65b8ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
