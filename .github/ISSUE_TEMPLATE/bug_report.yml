name: Relatar um bug
description: Informe um comportamento reproduzível da Orla.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por ajudar. Remova nomes de usuário, empresa, rede, títulos de janelas e outros dados privados antes de enviar.
  - type: input
    id: orla-version
    attributes:
      label: Versão da Orla
      placeholder: "1.2.10"
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows
      description: Edição, versão e build.
      placeholder: "Windows 11 24H2, build 26100"
    validations:
      required: true
  - type: textarea
    id: displays
    attributes:
      label: Monitores e escala
      placeholder: "2 monitores; 1920x1080 a 100% e 2560x1440 a 125%"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      description: Liste uma sequência mínima e repetível.
      placeholder: |
        1. Abra...
        2. Clique...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Resultado observado
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnóstico sanitizado
      description: Trecho relevante do log, medições ou captura sem informações privadas.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmações
      options:
        - label: Testei na release mais recente.
          required: true
        - label: Consultei a solução de problemas.
          required: true
        - label: Removi informações privadas do conteúdo enviado.
          required: true
