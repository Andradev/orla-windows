        <rect x="56" y="18" width="368" height="6" rx="3" fill="#54aaff"/>
        <circle cx="424" cy="21" r="9" fill="#eef7ff" stroke="#54aaff" stroke-width="3"/>
        <text x="510" y="5" fill="#9fb0c8" font-size="11" text-anchor="end">80%</text>
      </g>
