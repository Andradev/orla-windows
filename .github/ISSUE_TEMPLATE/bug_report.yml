name: Bug report
description: Report reproducible Orla behavior.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping. Remove usernames, company/network names, window titles, and other private data before submitting.
  - type: input
    id: orla-version
    attributes:
      label: Orla version
      placeholder: "2.0.0"
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      description: Edition, version, and build number.
      placeholder: "Windows 11 24H2, build 26100"
    validations:
      required: true
  - type: dropdown
    id: taskbar-mode
    attributes:
      label: Taskbar mode
      options:
        - Native
        - OrlaDock (legacy)
        - Unknown
    validations:
      required: true
  - type: textarea
    id: displays
    attributes:
      label: Displays and scaling
      placeholder: "2 displays; 1920x1080 at 100% and 2560x1440 at 125%"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide the smallest repeatable sequence.
      placeholder: |
        1. Open...
        2. Click...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Relevant log excerpt, measurements, or screenshot without private information.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I tested the latest stable release.
          required: true
        - label: I read the troubleshooting guide.
          required: true
        - label: I removed private information from this report.
          required: true
