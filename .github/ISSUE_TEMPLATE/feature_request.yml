name: Feature request
description: Suggest a focused, lightweight improvement aligned with Orla's scope.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Explain the need before describing an implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: scope
    attributes:
      label: Primary area
      options:
        - Native taskbar integration
        - Legacy dock
        - Top bar
        - Quick Panel
        - Multi-monitor
        - Performance
        - Installation or recovery
        - Documentation
    validations:
      required: true
  - type: checkboxes
    id: principles
    attributes:
      label: Project principles
      options:
        - label: The proposal preserves non-admin operation.
          required: true
        - label: The proposal does not require a service, injection, or Windows file modification.
          required: true
        - label: The proposal considers CPU and memory cost.
          required: true
